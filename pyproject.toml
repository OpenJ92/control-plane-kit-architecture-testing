[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "control-plane-kit-architecture-testing"
version = "0.1.0"
description = "Immutable architecture testing language for Control Plane Kit repositories"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "OpenJ92" }
]
dependencies = []

[project.urls]
Repository = "https://github.com/OpenJ92/control-plane-kit-architecture-testing"

[tool.setuptools.packages.find]
where = ["src"]
include = ["control_plane_kit_architecture_testing*"]

[tool.setuptools.package-data]
control_plane_kit_architecture_testing = ["py.typed"]
